[build-system]
requires = ["setuptools>=70.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fcrm"
version = "0.1.0"
description = "NSRAL Full Climate Risk Model — Basel A-IRB aligned systemic stress testing engine"
authors = [{ name = "NSE Sustainability Ratings and Analytics Ltd." }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26.0",
    "scipy>=1.13.0",
    "pandas>=2.2.0",
    "jax[cpu]>=0.4.28",
    "optax>=0.2.3",
    "yfinance>=0.2.40",
    "requests>=2.32.0",
    "statsmodels>=0.14.2",
    "scikit-learn>=1.5.0",
    "tqdm>=4.66.0",
    "pyarrow>=16.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-cov", "ruff"]

[tool.setuptools.packages.find]
where = ["."]
include = ["fcrm*"]

[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

